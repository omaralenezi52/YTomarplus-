name: Build YTOmarPlus

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build (rootless)
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Build (rootful)
        run: make package FINALPACKAGE=1

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YTOmarPlus-debs
          path: packages/*.deb
